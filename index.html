<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--og-->
<title>הדסה איפור ותסרוקות ערב</title>
<meta name="description" content="תסרוקות ערב ואיפור לנשים ולנערות">
<meta property="og:title" content="הדסה איפור ותסרוקות ערב">
<meta property="og:description" content="תסרוקות ערב ואיפור לנשים ולנערות">
<meta property="og:type" content="website">
<meta property="og:image" content="https://hadasa-beauty.github.io/images/logo-fi6g4s4ylj.png">
<!--/og-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%84%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=Bellefair&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F2F3; --surface:#FFFFFF; --ink:#2B1726; --muted:#7A6372;
  --accent:#8C2752; --accent-ink:#FFFFFF; --blush:#EED9DF; --gold:#BF9B6F; --line:#E6D3D9;
  --shadow:0 18px 40px -24px rgba(60,20,45,.45);
  --display:"Bellefair","Frank Ruhl Libre","David",Georgia,serif;
  --body:"Assistant","Segoe UI",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B1119; --surface:#261823; --ink:#F5E9EE; --muted:#B79FAE;
    --accent:#E07AA3; --accent-ink:#1B1119; --blush:#3A2534; --gold:#C9A77C; --line:#3C2A37;
    --shadow:0 18px 40px -24px rgba(0,0,0,.8); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1119; --surface:#261823; --ink:#F5E9EE; --muted:#B79FAE;
  --accent:#E07AA3; --accent-ink:#1B1119; --blush:#3A2534; --gold:#C9A77C; --line:#3C2A37;
  --shadow:0 18px 40px -24px rgba(0,0,0,.8); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}

/* ---------- hero ---------- */
.hero{display:grid;gap:36px;padding:48px 0 40px;align-items:center}
@media (min-width:880px){.hero{grid-template-columns:1fr 1.05fr;padding:72px 0 56px}}
.hero-logo{display:block;max-height:120px;max-width:min(280px,70%);width:auto;height:auto;margin:0 0 18px;object-fit:contain}
.foot-logo{max-height:56px;width:auto;margin-bottom:6px}
.logo-edit{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo-edit .prev{width:120px;height:90px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:13px}
.logo-edit .prev img{max-width:100%;max-height:100%;object-fit:contain}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(46px,9vw,96px);line-height:.98;margin:0 0 16px;letter-spacing:-.01em}
.tagline{font-size:clamp(19px,2.4vw,23px);color:var(--accent);margin:0 0 14px;font-weight:600}
.about{color:var(--muted);max-width:46ch;margin:0 0 26px;white-space:pre-line}
.cta{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);text-decoration:none;padding:13px 24px;border-radius:999px;font-weight:600;border:0}
.cta svg{width:20px;height:20px}
.cta.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}

.arches{display:grid;grid-template-columns:1fr 1.18fr 1fr;gap:14px;align-items:end}
.arch{position:relative;padding:7px;border:1px solid var(--gold);border-radius:999px 999px 16px 16px;background:none;cursor:pointer;width:100%}
.arch:nth-child(2){transform:translateY(-22px)}
.arch .in{border-radius:999px 999px 10px 10px;overflow:hidden;aspect-ratio:3/4.7;background:linear-gradient(170deg,var(--blush),var(--bg))}
.arch:nth-child(2) .in{aspect-ratio:3/5.1}
.arch img{width:100%;height:100%;object-fit:cover}
.arch.empty{cursor:default}
@media (prefers-reduced-motion:no-preference){
  .arch{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
  .arch:nth-child(1){animation-delay:.12s}.arch:nth-child(3){animation-delay:.24s}
  @keyframes rise{from{opacity:0;translate:0 26px}to{opacity:1;translate:0 0}}
}

/* ---------- browse ---------- */
.browse{padding-bottom:64px}
.toolbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 12px;margin:0 -20px;padding-inline:20px;border-bottom:1px solid var(--line);top:env(safe-area-inset-top,0px)}
.search{position:relative;max-width:560px}
.search input{width:100%;padding:13px 46px 13px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:17px}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;right:16px;top:50%;translate:0 -50%;width:20px;height:20px;color:var(--muted);pointer-events:none}
.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:12px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);padding:7px 15px;border-radius:999px;font-size:15px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 14px;border-radius:999px;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--blush);color:var(--ink);font-weight:600}
.count{color:var(--muted);font-size:15px;margin:18px 0 14px}

.grid{columns:2 170px;column-gap:14px}
@media (min-width:700px){.grid{columns:3 220px;column-gap:20px}}
@media (min-width:1050px){.grid{columns:4 240px}}
.card{break-inside:avoid;margin:0 0 18px;display:block;width:100%;text-align:inherit;background:none;border:0;padding:0}
.card .ph{position:relative;border-radius:14px;overflow:hidden;background:var(--blush)}
.card img{width:100%;height:auto}
.card .multi{position:absolute;bottom:8px;left:8px;background:rgba(27,17,25,.62);color:#fff;font-size:13px;padding:2px 9px;border-radius:999px}
.card .cap{padding:9px 2px 0}
.card .t{font-weight:600;font-size:16px;line-height:1.3}
.card .c{color:var(--muted);font-size:14px}
.empty-state{border:1px dashed var(--line);border-radius:18px;padding:44px 24px;text-align:center;color:var(--muted)}
.empty-state button{margin-top:14px}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;padding:0}

.foot{border-top:1px solid var(--line);padding:34px 0 110px;color:var(--muted);font-size:15px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
.foot strong{font-family:var(--display);font-weight:400;font-size:24px;color:var(--ink)}
.foot a{color:var(--accent)}

.wa-float{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow)}
.wa-float svg{width:28px;height:28px}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;grid-template-rows:1fr auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:900px){.lb{grid-template-rows:none;grid-template-columns:1fr 380px}}
.lb-stage{position:relative;min-height:0;display:grid;place-items:center;padding:56px 12px 12px;background:var(--blush);touch-action:pan-y}
.lb-stage img{max-height:100%;max-width:100%;object-fit:contain;border-radius:10px}
@media (max-width:899px){.lb-stage img{max-height:62vh}}
.lb-close{position:absolute;top:12px;right:12px;z-index:2;width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);font-size:26px;line-height:1;box-shadow:var(--shadow)}
.lb-arrow{position:absolute;top:50%;translate:0 -50%;width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);font-size:24px;box-shadow:var(--shadow)}
.lb-arrow.prev{right:12px}.lb-arrow.next{left:12px}
.dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--surface);opacity:.55}
.dots span.on{opacity:1;background:var(--accent)}
.lb-info{padding:22px 22px 18px;overflow:auto;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.lb-info .meta{color:var(--accent);font-weight:600;font-size:15px}
.lb-info h2{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.1;margin:0}
.lb-info p{margin:0;color:var(--muted);white-space:pre-line}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:14px}
.lb-nav{display:flex;justify-content:space-between;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.lb-nav button{background:none;border:0;color:var(--muted);padding:8px 0}

/* ---------- owner controls ---------- */
.admin-pill{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:20;border:1px solid var(--line);background:var(--surface);padding:10px 18px;border-radius:999px;box-shadow:var(--shadow);font-weight:600}
.draft-bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:30;background:var(--ink);color:var(--bg);display:flex;gap:14px;align-items:center;justify-content:center;padding:9px 16px;font-size:15px;flex-wrap:wrap}
.draft-bar button{border:0;border-radius:999px;padding:6px 14px;background:var(--bg);color:var(--ink);font-weight:600}
.draft-bar button.alt{background:transparent;color:var(--bg);text-decoration:underline}

.ed-back{position:fixed;inset:0;z-index:40;background:rgba(27,17,25,.45)}
.ed{position:fixed;top:0;bottom:0;right:0;z-index:41;width:min(600px,100%);background:var(--bg);display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ed-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.ed-head h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0;flex:1}
.ed-x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1}
.ed-tabs{display:flex;gap:4px;padding:10px 18px 0;border-bottom:1px solid var(--line)}
.ed-tabs button{border:0;background:none;padding:9px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600}
.ed-tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.ed-body{flex:1;overflow:auto;padding:18px}
.ed-foot{border-top:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.meter{flex:1;min-width:180px;font-size:13px;color:var(--muted)}
.meter .bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:4px}
.meter .bar i{display:block;height:100%;background:var(--accent)}
.meter.warn{color:#B3261E}.meter.warn .bar i{background:#B3261E}
.btn{border:0;border-radius:999px;padding:10px 20px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn[disabled]{opacity:.5;cursor:default}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:#B3261E;border:1px solid currentColor}
.hint{color:var(--muted);font-size:14px;margin:4px 0 14px}

.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:60px 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.row.off{opacity:.55}
.row img,.row .noimg{width:60px;height:72px;object-fit:cover;border-radius:9px;background:var(--blush)}
.row .t{font-weight:600}
.row .s{font-size:14px;color:var(--muted)}
.acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.ic{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:14px}
.ic[aria-pressed="true"]{background:var(--blush);border-color:var(--gold)}
@media (min-width:520px){.row{grid-template-columns:60px 1fr auto}.acts{grid-column:auto;justify-content:flex-end;max-width:260px}}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:16px}
.field label,.field .lbl{font-weight:600;font-size:15px}
.field input[type=text],.field input[type=tel],.field input[type=url],.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:400;cursor:pointer}
.radios input{accent-color:var(--accent);margin-inline-end:6px}
.check{display:flex;gap:9px;align-items:center;margin-bottom:10px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.thumbs{display:flex;flex-wrap:wrap;gap:10px}
.thumb{position:relative;width:92px}
.thumb img{width:92px;height:116px;object-fit:cover;border-radius:10px}
.thumb .badge{position:absolute;top:5px;right:5px;background:var(--accent);color:var(--accent-ink);font-size:12px;border-radius:999px;padding:1px 8px}
.thumb .tb{display:flex;justify-content:space-between;margin-top:4px}
.thumb .tb button{border:0;background:none;font-size:13px;color:var(--muted);padding:2px}
.add-img{width:92px;height:116px;border:1.5px dashed var(--gold);border-radius:10px;display:grid;place-items:center;text-align:center;font-size:14px;color:var(--muted);cursor:pointer;background:var(--surface)}
.add-img input{display:none}
.cat-add{display:flex;gap:8px;margin-top:16px}
.bulk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
.bulk-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bulk-row select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;flex:1;min-width:130px}
.cat-add input{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.cat-row{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.cat-row input{flex:1;border:0;background:none;padding:6px;min-width:0}
.cat-row .n{color:var(--muted);font-size:13px;white-space:nowrap}

.toast{position:fixed;left:50%;translate:-50% 0;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:15px;max-width:min(92vw,460px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.busy{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(27,17,25,.5);color:#fff;font-size:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.loading{min-height:70vh;display:grid;place-items:center;color:var(--muted);font-size:18px}
.ai-badge{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:var(--blush);border-radius:999px;padding:1px 8px;vertical-align:middle;margin-inline-start:4px}
.skip{position:absolute;right:12px;top:-60px;z-index:100;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;text-decoration:none;font-weight:600}
.skip:focus{top:calc(10px + env(safe-area-inset-top,0px))}
.browse:focus{outline:none}
.legal{flex-basis:100%;display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.legal .linkbtn{color:var(--muted)}
.a11y-btn{position:fixed;left:18px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:20;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow)}
.a11y-btn svg{width:24px;height:24px}
.a11y-panel{position:fixed;left:18px;bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:45;width:min(290px,calc(100vw - 36px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:8px}
.a11y-head{display:flex;justify-content:space-between;align-items:center}
.a11y-x{border:0;background:none;font-size:24px;width:36px;height:36px}
.a11y-size{display:flex;align-items:center;gap:8px}.a11y-size span{flex:1}
.a11y-size button{border:1px solid var(--line);background:var(--bg);border-radius:10px;width:46px;height:38px;font-weight:700}
.a11y-opt{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;text-align:right}
.a11y-opt[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.docpage{position:fixed;inset:0;z-index:55;margin:auto;width:min(720px,100%);height:min(88vh,100%);overflow:auto;background:var(--bg);border-radius:18px;padding:28px 24px 32px;box-shadow:var(--shadow)}
@media (max-width:720px){.docpage{height:100%;border-radius:0;padding-top:calc(28px + env(safe-area-inset-top,0px))}}
.docpage h2{font-family:var(--display);font-weight:400;font-size:34px;margin:0 0 14px;padding-left:48px}
.docpage h3{font-size:18px;margin:20px 0 6px}
.docpage p,.docpage li{color:var(--ink)}
.docpage a{color:var(--accent)}
.doc-x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.preset{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:right}
.preset[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.preset .dots{display:flex}.preset .dots i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.15);margin-inline-start:-4px}
.color-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0}
.color-row label{min-width:90px}
.color-row input[type=color]{width:48px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px}
.font-sample{border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin-top:4px}
.warn{border:1px solid #B3261E;color:#B3261E;background:var(--surface);border-radius:12px;padding:10px 14px;margin:0 0 16px;font-size:15px}
.warn ul{margin:6px 0;padding-right:18px}
.consent{margin:10px 0 0;font-size:14px;font-weight:600;color:var(--accent)}
html.a11y-contrast{--bg:#FFFFFF!important;--surface:#FFFFFF!important;--ink:#000000!important;--muted:#000000!important;--accent:#0B3D91!important;--accent-ink:#FFFFFF!important;--blush:#E8E8E8!important;--line:#000000!important;--gold:#000000!important;color-scheme:light!important}
html.a11y-links a,html.a11y-links button,html.a11y-links .linkbtn{text-decoration:underline!important;outline:2px solid currentColor;outline-offset:2px}
html.a11y-font{--display:Arial,"Segoe UI",sans-serif!important;--body:Arial,"Segoe UI",sans-serif!important}
html.a11y-font body{letter-spacing:.02em;word-spacing:.08em}
html.a11y-still *,html.a11y-still *::before,html.a11y-still *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
</style>
</head>
<body>
<div id="root"></div>
<script>(function(){

function aiError(e){

        messages:[{role:'user', content:[

          {type:'text', text:'Look at the hairstyle and makeup in this photo and return JSON with these keys:\n' +

function pool(items, size, fn){

  var bf = box.querySelector('#bulkfile'); if (bf) bf.addEventListener('change', function(){ bulkAdd(bf.files); });
  var fi = box.querySelector('#imgfile'); if (fi) fi.addEventListener('change', function(){ addImages(fi.files); });
  var lf = box.querySelector('#logofile'); if (lf) lf.addEventListener('change', function(){ setLogo(lf.files && lf.files[0]); });
  var sn = box.querySelector('#showname'); if (sn) sn.addEventListener('change', function(){ draft.site.showName = sn.checked ? 'yes' : ''; markDirty(); });
  var lt = box.querySelector('#l-token'); if (lt){ lt.focus(); lt.addEventListener('keydown', function(e){ if (e.key === 'Enter') doLogin(); }); }
}
function addCat(){ var el = document.getElementById('newcat'), v = el && el.value.trim(); if (!v) return; draft.categories.push({id:'c'+uid(), name:v}); markDirty(); }
function moveIn(arr, id, d){ var i = arr.findIndex(function(x){return x.id===id;}), j = i + d; if (i < 0 || j < 0 || j >= arr.length) return; var t = arr[i]; arr[i] = arr[j]; arr[j] = t; markDirty(); }

/* ---------- images ---------- */
function loadImage(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){ res({img:img, done:function(){ URL.revokeObjectURL(url); }}); };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('bad')); };
    img.src = url;
  });
}
function draw(img, max, type, q){
  var k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL(type, q);
}
function shrink(file){
  return loadImage(file).then(function(r){ var o = {full:draw(r.img, 1600, 'image/jpeg', 0.84), thumb:draw(r.img, 640, 'image/jpeg', 0.8)}; r.done(); return o; });
}
function addImages(files){
  files = Array.prototype.slice.call(files || []); if (!files.length) return;
  var busy = showBusy('מעבד תמונות…'), failed = 0;
  files.reduce(function(p, f){ return p.then(function(){ return shrink(f).then(function(d){ ed.form.images.push(d); }, function(){ failed++; }); }); }, Promise.resolve())
  .then(function(){ busy.remove(); renderEditor(); if (failed) toast(failed + ' תמונות לא נטענו. אפשר לנסות שוב בפורמט JPG או PNG.'); });
}
function bulkAdd(files){
  files = Array.prototype.slice.call(files || []); if (!files.length) return;
  var busy = showBusy('מעבד תמונות… 0 מתוך ' + files.length), added = [], failed = 0, n = 0;
  files.reduce(function(p, f){
    return p.then(function(){ return shrink(f).then(function(d){ added.push({id:'w'+uid(), title:'', cat:ed.bulkCat, type:ed.bulkType, tags:[], desc:'', images:[d], visible:true, featured:false}); }, function(){ failed++; })
      .then(function(){ busy.textContent = 'מעבד תמונות… ' + (++n) + ' מתוך ' + files.length; }); });
  }, Promise.resolve()).then(function(){
    busy.remove();
    var autoCat = ed.bulkCat === AUTO, autoType = ed.bulkType === AUTO;
    added.forEach(function(w){ if (autoCat) w.cat = ''; if (autoType) w.type = 'hair'; if (ed.bulkHide) w.visible = false; });
    var wantAI = (autoCat || autoType) && aiKey();
    var keep = added.map(function(w){ return {cat:w.cat, type:w.type}; });
    return (wantAI ? detectWorks(added) : Promise.resolve(0)).then(function(ok){
      added.forEach(function(w, i){ if (!autoCat) w.cat = keep[i].cat; if (!autoType) w.type = keep[i].type; });
      draft.works = added.concat(draft.works); if (wantAI) ed.reviewOnly = true; markDirty();
      var msg = added.length ? 'נוספו ' + plural(added.length) + (wantAI && ok ? ' וזוהו אוטומטית. כדאי לעבור עליהן ולאשר.' : '.') + ' „פרסום השינויים” מעלה אותן לאתר.' : '';
      if (failed) msg += ' ' + failed + ' תמונות לא נטענו.';
      if (!wantAI || ok === added.length) toast(msg.trim(), 6000);
    });
  });
}
function setLogo(file){
  if (!file) return;
  loadImage(file).then(function(r){
    var png = file.type !== 'image/jpeg';
    draft.site.logo = draw(r.img, 600, png ? 'image/png' : 'image/jpeg', 0.9); r.done(); markDirty(); toast('הלוגו עודכן. „פרסום השינויים” מעלה אותו לאתר.');
  }, function(){ toast('הקובץ לא נטען. אפשר לנסות PNG או JPG.'); });
}

/* ---------- work form ---------- */
function startForm(w){
  ed.form = w ? {isNew:false, id:w.id, title:w.title, cat:w.cat, type:w.type, tags:w.tags.join(', '), desc:w.desc, images:w.images.slice(), visible:w.visible, featured:w.featured, review:w.review}
              : {isNew:true, id:'w'+uid(), title:'', cat:ed.bulkCat||'', type:'hair', tags:'', desc:'', images:[], visible:true, featured:false};
  renderEditor(); var b = document.querySelector('.ed-body'); if (b) b.scrollTop = 0;
}
function saveForm(){
  var F = ed.form; if (!F.images.length){ toast('צריך לפחות תמונה אחת לעבודה.'); return; }
  var w = {id:F.id, title:F.title.trim(), cat:F.cat, type:F.type, tags:F.tags.split(/[,،]/).map(function(t){return t.trim();}).filter(Boolean), desc:F.desc.trim(), images:F.images, visible:F.visible, featured:F.featured, review:false};
  if (F.isNew) draft.works.unshift(w); else draft.works = draft.works.map(function(x){ return x.id === w.id ? w : x; });
  ed.form = null; ed.tab = 'works'; markDirty(); toast('העבודה נשמרה. „פרסום השינויים” מעלה אותה לאתר.');
}

/* ---------- publish to GitHub ---------- */
function isData(s){ return typeof s === 'string' && s.indexOf('data:') === 0; }
function imagePaths(st){
  var out = {}; if (st.site.logo && !isData(st.site.logo)) out[st.site.logo] = 1;
  st.works.forEach(function(w){ w.images.forEach(function(i){ [i.full, i.thumb].forEach(function(p){ if (p && !isData(p)) out[p] = 1; }); }); });
  return out;
}
function ogBlock(st){
  var s = st.site, vis = st.works.filter(function(w){return w.visible && w.images.length;}), f = vis.filter(function(w){return w.featured;})[0] || vis[0];
  var img = f ? f.images[0].thumb : s.logo, base = siteBase();
  return '<!--og-->\n<title>'+esc(s.name)+'</title>\n<meta name="description" content="'+esc(s.tagline)+'">\n<meta property="og:title" content="'+esc(s.name)+'">\n<meta property="og:description" content="'+esc(s.tagline)+'">\n<meta property="og:type" content="website">\n' +
    (img ? '<meta property="og:image" content="'+esc(base + img)+'">\n' : '') + '<!--/og-->';
}
function publish(){
  if (!canEdit || !dirty) return;
  var busy = showBusy('מפרסם…'), state = clone(draft), tree = [], head, baseTree, uploads = [], localSrc = {};
  ghFetch('/git/ref/heads/' + cfg.branch).then(function(ref){
    head = ref.object.sha;
    if (head === gh.sha) return null;
    return ghFetch('/contents/data.json?ref=' + head, {raw:true, allow404:true}).then(function(t){
      if (t !== gh.dataText){ var e = new Error('changed'); e.changed = true; throw e; }
    });
  }).then(function(){ return ghFetch('/git/commits/' + head); })
  .then(function(c){
    baseTree = c.tree.sha;
    function queue(dataUrl, path){ uploads.push({data:dataUrl, path:path}); localSrc[path] = dataUrl; return path; }
    if (isData(state.site.logo)) state.site.logo = queue(state.site.logo, 'images/logo-' + uid() + (state.site.logo.indexOf('image/png') > 0 ? '.png' : '.jpg'));
    state.works.forEach(function(w){ w.images = w.images.map(function(i){
      if (!isData(i.full)) return i; var id = uid();
      return {full:queue(i.full, 'images/' + id + '.jpg'), thumb:queue(i.thumb, 'images/' + id + '-t.jpg')};
    }); });
    var n = 0;
    return uploads.reduce(function(p, u){ return p.then(function(){
      busy.textContent = 'מעלה תמונות… ' + (++n) + ' מתוך ' + uploads.length;
      return ghFetch('/git/blobs', {method:'POST', body:{content:u.data.split(',')[1], encoding:'base64'}}).then(function(b){ tree.push({path:u.path, mode:'100644', type:'blob', sha:b.sha}); });
    }); }, Promise.resolve());
  }).then(function(){
    busy.textContent = 'שומר…';
    var before = imagePaths(saved), after = imagePaths(state);
    Object.keys(before).forEach(function(p){ if (!after[p] && p.indexOf('images/') === 0) tree.push({path:p, mode:'100644', type:'blob', sha:null}); });
    state.v = 2; state.site.a11yDate = today();
    var text = JSON.stringify(state);
    tree.push({path:'data.json', mode:'100644', type:'blob', content:text});
    state._text = text;
    return ghFetch('/contents/index.html?ref=' + head, {raw:true, allow404:true});
  }).then(function(idx){
    if (idx && idx.indexOf('<!--og-->') !== -1){
      var nidx = idx.replace(/<!--og-->[\s\S]*?<!--\/og-->/, ogBlock(state));
      if (nidx !== idx) tree.push({path:'index.html', mode:'100644', type:'blob', content:nidx});
    }
    return ghFetch('/git/trees', {method:'POST', body:{base_tree:baseTree, tree:tree}});
  }).then(function(t){ return ghFetch('/git/commits', {method:'POST', body:{message:'עדכון הגלריה', tree:t.sha, parents:[head]}}); })
  .then(function(c){ return ghFetch('/git/refs/heads/' + cfg.branch, {method:'PATCH', body:{sha:c.sha}}).then(function(){ return c.sha; }); })
  .then(function(sha){
    gh.sha = sha; gh.dataText = state._text; delete state._text;
    for (var k in localSrc) pendingSrc[k] = localSrc[k];
    saved = state; draft = clone(state); dirty = false;
    busy.remove(); render(); if (ed.open) renderEditor();
    toast('פורסם. הלקוחות יראו את העדכון בקישור תוך דקה-שתיים.', 5000);
  }).catch(function(e){
    busy.remove();
    if (e && e.changed){ toast('הגלריה עודכנה ממכשיר אחר. כדי לא לדרוס את השינויים שלו, צריך לרענן את הדף ולבצע את השינויים מחדש.', 8000); return; }
    toast(ghError(e), 6000);
  });
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-open],[data-cat],[data-type],[data-tag],[data-act],[data-tab],[data-a11y]'); if (!t) return;
  if (t.dataset.a11y){ a11y[t.dataset.a11y] = !a11y[t.dataset.a11y]; applyA11y(); refreshA11y(); return; }
  if (a11yOpen && !t.closest('#a11y-panel') && t.dataset.act !== 'a11y-open') closeA11y();
  if (t.dataset.open){ openLB(t.dataset.open, t); return; }
  if (t.dataset.cat){ ui.cat = t.dataset.cat; document.querySelectorAll('[data-cat]').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.cat === ui.cat); }); renderGrid(); return; }
  if (t.dataset.type){ ui.type = t.dataset.type; document.querySelectorAll('[data-type]').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.type === ui.type); }); renderGrid(); return; }
  if (t.dataset.tag){ ui.q = t.dataset.tag; ui.cat = 'all'; ui.type = 'all'; closeLB(); render(); var g = document.getElementById('works'); if (g) g.scrollIntoView(); return; }
  if (t.dataset.tab){ ed.tab = t.dataset.tab; ed.pending = null; renderEditor(); return; }
  var a = t.dataset.act, id = t.dataset.id, w = id && draft.works.filter(function(x){return x.id===id;})[0];
  if (ed.pending && a !== 'w-del' && a !== 'c-del' && a !== 'close-editor' && a !== 'logout' && a !== 'approve-all' && a !== 'ai-off' && a !== 'th-reset'){ ed.pending = null; if (ed.open) renderEditor(); }
  switch (a){
    case 'clear': ui = {q:'', cat:'all', type:'all'}; render(); break;
    case 'lb-close': closeLB(); break;
    case 'img-prev': stepImg(-1); break;
    case 'img-next': stepImg(1); break;
    case 'work-prev': stepWork(-1); break;
    case 'work-next': stepWork(1); break;
    case 'open-editor': if (canEdit) openEditor(); else openLogin(); break;
    case 'close-editor': if (ed.form && !needConfirm('close', 'העבודה עוד לא נשמרה. לחיצה נוספת על × תסגור בלי לשמור.')) return; closeEditor(); break;
    case 'login': doLogin(); break;
    case 'logout': if (!needConfirm('logout', 'לחיצה נוספת תנתק את המכשיר הזה. הגלריה עצמה לא תושפע.')) return; try{ localStorage.removeItem(CFG_KEY); }catch(x){} location.href = location.pathname; break;
    case 'publish': publish(); break;
    case 'w-new': startForm(null); break;
    case 'w-edit': if (w) startForm(w); break;
    case 'w-vis': if (w){ w.visible = !w.visible; markDirty(); } break;
    case 'w-feat': if (w){ w.featured = !w.featured; markDirty(); } break;
    case 'w-up': moveIn(draft.works, id, -1); break;
    case 'w-down': moveIn(draft.works, id, 1); break;
    case 'w-del': if (!needConfirm('w-del'+id, 'לחיצה נוספת על הכפתור תמחק את העבודה.')) return; draft.works = draft.works.filter(function(x){return x.id!==id;}); ed.form = null; markDirty(); break;
    case 'c-add': addCat(); break;
    case 'c-up': moveIn(draft.categories, id, -1); break;
    case 'c-down': moveIn(draft.categories, id, 1); break;
    case 'c-del':
      var n = draft.works.filter(function(x){return x.cat===id;}).length;
      if (!needConfirm('c-del'+id, n ? 'לחיצה נוספת תמחק את הקטגוריה. ' + plural(n) + ' יישארו בלי קטגוריה.' : 'לחיצה נוספת תמחק את הקטגוריה.')) return;
      draft.categories = draft.categories.filter(function(c){return c.id!==id;}); draft.works.forEach(function(x){ if (x.cat===id) x.cat=''; }); markDirty(); break;
    case 'logo-del': draft.site.logo = ''; markDirty(); break;
    case 'th-preset': draft.theme.preset = t.dataset.k; draft.theme.accent = draft.theme.bg = draft.theme.ink = ''; markDirty(); break;
    case 'th-clear': draft.theme[t.dataset.k] = ''; markDirty(); break;
    case 'th-reset': if (!needConfirm('th-reset')) return; draft.theme = clone(DEFAULT_THEME); markDirty(); break;
    case 'show-a11y': doc.ret = t; doc.open = 'a11y'; closeA11y(); renderDoc(); break;
    case 'show-privacy': doc.ret = t; doc.open = 'privacy'; renderDoc(); break;
    case 'doc-close': doc.open = null; renderDoc(); break;
    case 'a11y-open': toggleA11y(); break;
    case 'a11y-close': closeA11y(); break;
    case 'a11y-bigger': a11y.size = Math.min(3, (a11y.size||0) + 1); applyA11y(); refreshA11y(); break;
    case 'a11y-smaller': a11y.size = Math.max(0, (a11y.size||0) - 1); applyA11y(); refreshA11y(); break;
    case 'a11y-reset': a11y = {}; applyA11y(); refreshA11y(); break;
    case 'w-ok': if (w){ w.review = false; w.visible = true; markDirty(); } break;
    case 'review-only': ed.reviewOnly = !ed.reviewOnly; renderEditor(); break;
    case 'approve-all': if (!needConfirm('approve-all', 'לחיצה נוספת תאשר את כל העבודות שזוהו ותציג אותן ללקוחות.')) return; draft.works.forEach(function(x){ if (x.review){ x.review = false; x.visible = true; } }); ed.reviewOnly = false; markDirty(); break;
    case 'detect-untitled': detectWorks(draft.works.filter(function(x){ return !x.title && x.images.length; })).then(function(ok){ if (ok){ ed.reviewOnly = true; markDirty(); toast('זוהו ' + plural(ok) + '. כדאי לעבור עליהן ולאשר.'); } }); break;
    case 'ai-off': if (!needConfirm('ai-off')) return; try{ localStorage.removeItem(AI_KEY); }catch(x){} if (ed.bulkCat === AUTO) ed.bulkCat = ''; if (ed.bulkType === AUTO) ed.bulkType = 'hair'; renderEditor(); break;
    case 'form-detect':
      var F = ed.form, busy = showBusy('מזהה…');
      detect(F.images[0].thumb).then(function(r){ busy.remove(); F.cat = r.cat || F.cat; F.type = r.type; if (r.title) F.title = r.title; if (r.tags.length) F.tags = r.tags.join(', '); renderEditor(); toast('הפרטים מולאו. אפשר לתקן ולשמור.'); },
        function(e){ busy.remove(); toast(aiError(e), 6000); });
      break;
    case 'form-cancel': ed.form = null; renderEditor(); break;
    case 'form-save': saveForm(); break;
    case 'img-del': ed.form.images.splice(+t.dataset.i, 1); renderEditor(); break;
    case 'img-main': var im = ed.form.images.splice(+t.dataset.i, 1)[0]; ed.form.images.unshift(im); renderEditor(); break;
  }
});
document.addEventListener('input', function(e){ if (e.target.id === 'q'){ ui.q = e.target.value; renderGrid(); } });
document.addEventListener('keydown', function(e){
  if (e.key === 'Tab') trapFocus(e);
  if (e.key === 'Escape' && doc.open){ doc.open = null; renderDoc(); return; }
  if (e.key === 'Escape' && a11yOpen){ closeA11y(); return; }
  if (lb.open){ if (e.key === 'Escape') closeLB(); else if (e.key === 'ArrowLeft') stepImg(1, true); else if (e.key === 'ArrowRight') stepImg(-1, true); }
  else if (ed.open && e.key === 'Escape'){ if (ed.form){ ed.form = null; renderEditor(); } else closeEditor(); }
});
window.addEventListener('beforeunload', function(e){ if (dirty){ e.preventDefault(); e.returnValue = ''; } });

/* ---------- boot ---------- */
document.body.insertAdjacentHTML('beforeend',
  '<div id="lightbox" hidden></div><div id="editor" hidden></div><div id="docbox" hidden></div><div id="a11ybox"></div>' +
  '<button class="admin-pill" id="admin-pill" data-act="open-editor" hidden>עריכת הגלריה</button>' +
  '<div class="draft-bar" id="draft-bar" hidden><span>יש שינויים שעדיין לא באתר</span><button data-act="publish">פרסום השינויים</button></div>' +
  '<div class="toast" id="toast" role="status"></div>');
applyA11y();
applyTheme(DEFAULT_THEME);
render();
if (cfg && cfg.token){
  loadFromGitHub().then(render, function(e){
    toast(ghError(e), 6000);
    return loadPublic().then(function(){ render(); if (wantEdit) openLogin(); });
  });
} else {
  loadPublic().then(function(){ render(); if (wantEdit) openLogin(); });
}
})();
</script>
</body>
